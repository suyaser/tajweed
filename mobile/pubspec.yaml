name: tajweed
description: "Tajweed Path (مسار التجويد), the mobile app. Content is shared with the web app (tool/sync_assets.sh)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # generated by tool/sync_assets.sh (git-ignored)
    - assets/shared/content/
    - assets/shared/content/teach/
    - assets/shared/i18n/ar/
    - assets/shared/data/surah/
    # OFL licence texts, registered in main.dart (showLicensePage)
    - assets/fonts/OFL-AmiriQuran.txt
    - assets/fonts/OFL-Amiri.txt
    - assets/fonts/OFL-NotoNaskhArabic.txt
    - assets/fonts/OFL-NotoSansArabic.txt
    - assets/fonts/OFL-Inter.txt
  # Same faces as the web (src/styles/app.css --font-*). Inter, Noto Sans Arabic and Noto Naskh Arabic are variable
  # fonts: weights go through FontVariation (lib/ui/theme.dart `weight()`).
  fonts:
    - family: Amiri Quran
      fonts: [{asset: assets/fonts/AmiriQuran-Regular.ttf}]
    - family: Amiri
      fonts: [{asset: assets/fonts/Amiri-Regular.ttf}]
    - family: Noto Naskh Arabic
      fonts: [{asset: assets/fonts/NotoNaskhArabic.ttf}]
    - family: Noto Sans Arabic
      fonts: [{asset: assets/fonts/NotoSansArabic.ttf}]
    - family: Inter
      fonts: [{asset: assets/fonts/Inter.ttf}]
